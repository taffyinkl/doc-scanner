[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docscanner"
version = "0.1.0"
description = "Scan PCs and connected drives for documents: find duplicates, extract content and dates, categorise and sort."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
extract = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "Pillow>=10.0",
]
ocr = ["pytesseract>=0.3.10"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
docscanner = "docscanner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/docscanner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
